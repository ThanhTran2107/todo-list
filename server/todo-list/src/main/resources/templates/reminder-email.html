<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Reminder</title>
    <style>
      body {
        margin: 0;
        padding: 3rem 1rem;
        background-color: #f8fafc;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .email-wrapper {
        width: 100%;
      }

      .email-wrapper td {
        padding: 0;
      }

      .email-container {
        width: 37.5rem;
        max-width: 37.5rem;
      }

      .email-container > tbody > tr > td {
        background-color: #ffffff;
        border-radius: 1.5rem;
        border: 0.0625rem solid #f1f5f9;
        overflow: hidden;
      }

      /* Header */
      .email-header {
        width: 100%;
      }

      .email-header > tbody > tr > td {
        padding: 1.5rem 2rem;
        border-bottom: 0.0625rem solid #f1f5f9;
        background-color: #ffffff;
      }

      .header-inner {
        width: 100%;
      }

      .header-inner > tbody > tr > td {
        vertical-align: middle;
      }

      .header-brand-wrapper {
        text-align: left;
      }

      .header-brand {
        width: auto;
      }

      .header-brand > tbody > tr > td {
        vertical-align: middle;
      }

      .header-brand > tbody > tr > td.logo-cell {
        padding-right: 0.625rem;
      }

      .logo-box {
        width: 2rem;
        height: 2rem;
        background-color: #2563eb;
        border-radius: 0.5rem;
        text-align: center;
        line-height: 2rem;
      }

      .logo-text {
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: bold;
      }

      .brand-name {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.025em;
      }

      .header-icon-cell {
        text-align: right;
        color: #94a3b8;
      }

      .header-icon {
        width: 1.5rem;
        height: 1.5rem;
      }

      /* Hero Section */
      .hero-section {
        width: 100%;
      }

      .hero-section > tbody > tr > td {
        background-color: rgba(239, 246, 255, 0.5);
        padding: 3rem 2rem;
        text-align: center;
        border-bottom: 0.0625rem solid #f1f5f9;
      }

      .hero-icon-box {
        width: 3.75rem;
        height: 3.75rem;
        background-color: rgba(219, 234, 254, 0.5);
        border-radius: 50%;
        margin: 0 auto 1.5rem auto;
        text-align: center;
        line-height: 3.4375rem;
      }

      .hero-icon {
        font-size: 2rem;
      }

      .hero-title {
        font-size: 1.875rem;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 1rem 0;
        letter-spacing: -0.025em;
      }

      .hero-text {
        color: #475569;
        font-size: 1.125rem;
        line-height: 1.625;
        max-width: 26.25rem;
        margin: 0 auto;
      }

      /* Content Body */
      .content-section {
        width: 100%;
      }

      .content-section > tbody > tr > td {
        padding: 2rem;
      }

      /* Task Card */
      .task-card-table {
        width: 100%;
      }

      .task-card-table > tbody > tr > td {
        background-color: #ffffff;
        border: 0.125rem solid #f8fafc;
        border-left: 0.375rem solid #2563eb;
        border-radius: 1rem;
        padding: 1.5rem;
      }

      .task-label {
        font-size: 0.6875rem;
        font-weight: 700;
        color: #2563eb;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin: 0 0 0.75rem 0;
      }

      .task-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 1.5rem 0;
        line-height: 1.25;
      }

      /* Deadline Box */
      .deadline-table {
        width: auto;
      }

      .deadline-table > tbody > tr > td {
        background-color: #f8fafc;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 0.0625rem solid #f1f5f9;
      }

      .deadline-inner {
        width: auto;
      }

      .deadline-inner > tbody > tr > td {
        vertical-align: middle;
      }

      .deadline-icon-cell {
        padding-right: 0.75rem;
      }

      .deadline-icon {
        width: 1.25rem;
        height: 1.25rem;
        color: #94a3b8;
      }

      .deadline-label {
        font-size: 0.625rem;
        color: #94a3b8;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        line-height: 1;
        margin: 0 0 0.25rem 0;
      }

      .deadline-value {
        color: #334155;
        font-weight: 600;
        margin: 0;
      }

      /* Message */
      .message-text {
        margin-top: 2.5rem;
        color: #475569;
        text-align: center;
        font-size: 1.125rem;
        margin-bottom: 0;
      }

      /* CTA */
      .cta-table {
        width: 100%;
      }

      .cta-table > tbody > tr > td {
        text-align: center;
        padding-top: 2.5rem;
      }

      .cta-button {
        display: inline-block;
        padding: 1.25rem 2.5rem;
        background-color: #2563eb;
        color: #ffffff !important;
        font-weight: 700;
        font-size: 1.125rem;
        border-radius: 1rem;
        text-decoration: none !important;
      }
    </style>
  </head>
  <body>
    <table
      class="email-wrapper"
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            class="email-container"
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
          >
            <tr>
              <td>
                <!-- Header -->
                <table
                  class="email-header"
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td>
                      <table
                        class="header-inner"
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                      >
                        <tr>
                          <td class="header-brand-wrapper" align="left">
                            <table
                              class="header-brand"
                              role="presentation"
                              cellspacing="0"
                              cellpadding="0"
                              border="0"
                            >
                              <tr>
                                <td class="logo-cell">
                                  <div class="logo-box">
                                    <span class="logo-text">&#10003;</span>
                                  </div>
                                </td>
                                <td>
                                  <span class="brand-name">Task Reminder</span>
                                </td>
                              </tr>
                            </table>
                          </td>
                          <td class="header-icon-cell" align="right">
                            <svg
                              class="header-icon"
                              fill="none"
                              stroke="currentColor"
                              viewBox="0 0 24 24"
                            >
                              <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                              ></path>
                            </svg>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>

                <!-- Hero Section -->
                <table
                  class="hero-section"
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td align="center">
                      <div class="hero-icon-box">
                        <span class="hero-icon">&#128276;</span>
                      </div>
                      <h1 class="hero-title">Upcoming Task Deadline</h1>
                      <p class="hero-text">
                        Hi there, you have an upcoming commitment that needs
                        attention.
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- Content Body -->
                <table
                  class="content-section"
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td>
                      <!-- Task Card -->
                      <table
                        class="task-card-table"
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                      >
                        <tr>
                          <td>
                            <p class="task-label">Upcoming Task</p>
                            <h3 class="task-title">{title}</h3>

                            <table
                              class="deadline-table"
                              role="presentation"
                              cellspacing="0"
                              cellpadding="0"
                              border="0"
                            >
                              <tr>
                                <td>
                                  <table
                                    class="deadline-inner"
                                    role="presentation"
                                    cellspacing="0"
                                    cellpadding="0"
                                    border="0"
                                  >
                                    <tr>
                                      <td class="deadline-icon-cell">
                                        <svg
                                          class="deadline-icon"
                                          fill="none"
                                          stroke="currentColor"
                                          viewBox="0 0 24 24"
                                        >
                                          <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            stroke-width="2"
                                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                                          ></path>
                                        </svg>
                                      </td>
                                      <td>
                                        <p class="deadline-label">Deadline</p>
                                        <p class="deadline-value">{dueDate}</p>
                                      </td>
                                    </tr>
                                  </table>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>

                      <p class="message-text">
                        Please review and complete this task on time.
                      </p>

                      <!-- CTA -->
                      <table
                        class="cta-table"
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        border="0"
                      >
                        <tr>
                          <td align="center">
                            <a href="{appUrl}/todos" class="cta-button">
                              Open Task List
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
